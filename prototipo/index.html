<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EmprendeCol · Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --tinta:#1f1b2e;--suave:#5d5873;--fondo:#f7f5f0;--papel:#fff;--borde:#e4e0d6;
  --pri:#4b3bb5;--pri-o:#392b94;--pri-c:#ece9fb;--acento:#d9822b;--acento-c:#fbefe2;
  --ok:#1f7a4d;--ok-c:#e3f4ea;--mal:#b3261e;--mal-c:#fce8e6;--info:#2a4e86;--info-c:#e8f0fb;
  --r:12px;--sombra:0 1px 2px rgba(31,27,46,.06),0 4px 16px rgba(31,27,46,.05);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--tinta);background:var(--fondo);line-height:1.5;padding-bottom:84px}
a{color:var(--pri)}
h1,h2,h3,.marca,.serif{font-family:Fraunces,Georgia,serif}
h1{font-size:clamp(1.6rem,3.2vw,2.3rem);margin:0;line-height:1.15}
h2{font-size:1.3rem;margin:0 0 10px}
h3{font-size:1.05rem;margin:0 0 6px}
p{margin:0 0 10px}
button{font:inherit}
.contenedor{max-width:1120px;margin:0 auto;padding:24px 16px 40px}

/* Barra */
.top{background:var(--tinta);color:#fff;position:sticky;top:0;z-index:20}
.top-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.marca{color:#fff;text-decoration:none;font-size:1.3rem;display:flex;align-items:center;gap:8px}
.sello{width:30px;height:30px;border-radius:8px;background:var(--acento);display:grid;place-items:center;font-size:1rem}
.nav{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.nav a{color:#d8d4ea;text-decoration:none;font-weight:500}
.nav a:hover,.nav a.activo{color:#fff}
.nav a.activo{text-decoration:underline;text-underline-offset:6px;text-decoration-color:var(--acento)}
.top-der{margin-left:auto;display:flex;gap:12px;align-items:center}
.icono-btn{position:relative;color:#fff;text-decoration:none;display:flex;align-items:center;gap:6px;font-weight:500}
.contador{position:absolute;top:-8px;right:-10px;background:var(--acento);color:#fff;font-size:.7rem;font-weight:700;border-radius:99px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.avatar{width:32px;height:32px;border-radius:50%;background:#3a3456;display:grid;place-items:center;font-weight:700;font-size:.85rem}

/* Selector de rol del prototipo */
.rol{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:30;background:var(--tinta);color:#bdb7d6;border-radius:99px;padding:6px;display:flex;align-items:center;gap:4px;box-shadow:0 8px 30px rgba(0,0,0,.25);font-size:.85rem}
.rol span{padding:0 10px 0 12px}
.rol button{border:0;background:transparent;color:#d8d4ea;padding:8px 14px;border-radius:99px;cursor:pointer;font-weight:600}
.rol button.on{background:#fff;color:var(--tinta)}

/* Botones y formularios */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--borde);background:var(--papel);color:var(--tinta);font-weight:600;padding:10px 18px;border-radius:10px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--suave)}
.btn-p{background:var(--pri);border-color:var(--pri);color:#fff}.btn-p:hover{background:var(--pri-o)}
.btn-a{background:var(--acento);border-color:var(--acento);color:#fff}
.btn-mal{color:var(--mal)}.btn-mal:hover{background:var(--mal-c);border-color:var(--mal)}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn-sm{padding:6px 12px;font-size:.85rem}
.btn-bloque{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 6px}
input,select,textarea{font:inherit;color:var(--tinta);background:#fff;border:1px solid var(--borde);border-radius:10px;padding:10px 12px;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,.btn:focus-visible{outline:3px solid rgba(75,59,181,.35);outline-offset:1px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:.9rem}
.check input{width:auto;margin-top:4px}
.fila{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* Piezas */
.tarjeta{background:var(--papel);border:1px solid var(--borde);border-radius:var(--r);padding:20px;box-shadow:var(--sombra)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;padding:3px 10px;border-radius:99px;background:var(--pri-c);color:var(--pri);font-weight:600}
.badge{display:inline-block;font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.b-gris{background:#eeece6;color:var(--suave)}.b-ok{background:var(--ok-c);color:var(--ok)}.b-mal{background:var(--mal-c);color:var(--mal)}
.b-info{background:var(--info-c);color:var(--info)}.b-acento{background:var(--acento-c);color:#9a5410}.b-pri{background:var(--pri-c);color:var(--pri)}
.sobre{color:var(--suave);font-size:.9rem;margin:0 0 4px}
.sobre a{color:var(--suave);text-decoration:none}
.cabecera{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.muted{color:var(--suave)}
.peq{font-size:.85rem}
.num{font-variant-numeric:tabular-nums}
.sep{border:0;border-top:1px solid var(--borde);margin:14px 0}
.linea{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
.linea.total{border-top:1px solid var(--borde);margin-top:6px;padding-top:10px;font-weight:700;font-size:1.05rem}
.aviso{display:flex;gap:12px;align-items:flex-start;background:var(--ok-c);border:1px solid #b5dfc5;color:#185e3b;padding:14px 16px;border-radius:var(--r);font-size:.92rem}
.aviso.info{background:var(--info-c);border-color:#c4d6f2;color:var(--info)}
.aviso.alerta{background:var(--acento-c);border-color:#f0cfa6;color:#82470d}
.aviso.mal{background:var(--mal-c);border-color:#f2b8b5;color:var(--mal)}
.aviso svg{flex:none;margin-top:2px}

/* Héroe */
.heroe{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:center;background:var(--tinta);color:#fff;border-radius:18px;padding:32px;margin-bottom:24px;overflow:hidden;position:relative}
.heroe h1{font-size:clamp(1.8rem,3.6vw,2.6rem)}
.heroe p{color:#d8d4ea;font-size:1.05rem;margin:12px 0 18px}
.pasos-confianza{display:grid;gap:10px}
.pasos-confianza div{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 14px;font-size:.92rem}
.pasos-confianza b{width:28px;height:28px;flex:none;border-radius:50%;background:var(--acento);display:grid;place-items:center;font-size:.85rem}
.buscador{display:flex;gap:8px;background:#fff;border-radius:12px;padding:6px}
.buscador input{border:0}
.buscador .btn{border:0}

/* Catálogo */
.catalogo{display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:start}
.filtros h3{font-family:Inter,sans-serif;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--suave);margin:16px 0 8px}
.filtros h3:first-child{margin-top:0}
.filtro-op{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--tinta)}
.filtro-op:hover{background:#efece4}
.filtro-op.on{background:var(--pri-c);color:var(--pri);font-weight:600}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.prod{background:var(--papel);border:1px solid var(--borde);border-radius:var(--r);overflow:hidden;text-decoration:none;color:var(--tinta);display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.prod:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(31,27,46,.08)}
.prod-cuerpo{padding:12px 14px 14px;display:grid;gap:4px}
.prod-nombre{font-weight:600}
.prod-precio{font-family:Fraunces,Georgia,serif;font-size:1.2rem}
.prod-emp{font-size:.82rem;color:var(--suave);display:flex;align-items:center;gap:6px}
.arte{aspect-ratio:4/3;display:grid;place-items:center;position:relative}
.arte svg{width:38%;height:38%;opacity:.9}
.arte .agotado{position:absolute;top:10px;left:10px}
.estrellas{color:var(--acento);letter-spacing:1px}
.vacio{text-align:center;padding:48px 16px;border:1px dashed var(--borde);border-radius:var(--r);background:var(--papel)}

/* Detalle */
.detalle{display:grid;grid-template-columns:1.1fr 1fr;gap:32px;align-items:start}
.detalle .arte{border-radius:var(--r);aspect-ratio:1/1}
.miniaturas{display:flex;gap:8px;margin-top:10px}
.miniaturas .arte{width:72px;aspect-ratio:1/1;border-radius:10px;border:2px solid transparent;cursor:pointer}
.miniaturas .arte.on{border-color:var(--pri)}
.precio-grande{font-family:Fraunces,Georgia,serif;font-size:2.2rem;margin:8px 0 4px}
.cantidad{display:inline-flex;align-items:center;border:1px solid var(--borde);border-radius:10px;background:#fff}
.cantidad button{border:0;background:transparent;width:40px;height:42px;cursor:pointer;font-size:1.1rem}
.cantidad span{min-width:36px;text-align:center;font-weight:600}
.emp-mini{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--tinta)}
.logo{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;font-family:Fraunces,Georgia,serif;font-size:1.2rem;flex:none}

/* Carrito y pedidos */
.dos-col{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
.grupo{margin-bottom:16px}
.grupo-cab{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--borde);margin-bottom:6px}
.item{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--borde)}
.item:last-child{border-bottom:0}
.item .arte{width:64px;aspect-ratio:1/1;border-radius:10px}
.item .arte svg{width:50%;height:50%}
.pegajoso{position:sticky;top:76px}
.opcion-pago{display:flex;gap:12px;align-items:center;border:1px solid var(--borde);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-weight:500}
.opcion-pago:has(input:checked){border-color:var(--pri);background:var(--pri-c)}
.opcion-pago input{width:auto;margin:0}

.lista-pedidos{display:grid;gap:12px}
.pedido-fila{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;text-decoration:none;color:var(--tinta)}
.pedido-fila:hover{border-color:var(--pri)}

/* Línea de tiempo */
.tiempo{list-style:none;padding:0;margin:0;position:relative}
.tiempo li{position:relative;padding:0 0 18px 34px}
.tiempo li:last-child{padding-bottom:0}
.tiempo li::before{content:"";position:absolute;left:10px;top:22px;bottom:-2px;width:2px;background:var(--borde)}
.tiempo li:last-child::before{display:none}
.tiempo .punto{position:absolute;left:0;top:2px;width:22px;height:22px;border-radius:50%;border:2px solid var(--borde);background:#fff;display:grid;place-items:center}
.tiempo li.hecho .punto{background:var(--ok);border-color:var(--ok)}
.tiempo li.hecho::before{background:var(--ok)}
.tiempo li.actual .punto{border-color:var(--pri);box-shadow:0 0 0 4px var(--pri-c)}
.tiempo li.alerta .punto{background:var(--acento);border-color:var(--acento)}
.tiempo b{display:block}
.tiempo small{color:var(--suave)}

/* Paneles */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:var(--papel);border:1px solid var(--borde);border-radius:var(--r);padding:16px}
.kpi span{font-size:.8rem;color:var(--suave)}
.kpi strong{display:block;font-family:Fraunces,Georgia,serif;font-size:1.6rem;margin-top:2px}
.kpi.destacado{background:var(--pri);border-color:var(--pri);color:#fff}
.kpi.destacado span{color:#d8d4ea}
.tabla-env{background:var(--papel);border:1px solid var(--borde);border-radius:var(--r);overflow:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--suave);padding:12px 14px;border-bottom:1px solid var(--borde);background:#fbfaf7}
td{padding:12px 14px;border-bottom:1px solid var(--borde);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.barras{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.barras div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.barras i{display:block;width:100%;max-width:44px;background:var(--pri);border-radius:6px 6px 0 0}
.barras i.ult{background:var(--acento)}
.barras small{color:var(--suave);font-size:.75rem}
.pasos-form{display:flex;gap:8px;margin-bottom:18px}
.pasos-form div{flex:1;padding:10px 12px;border-radius:10px;background:#efece4;color:var(--suave);font-weight:600;font-size:.88rem}
.pasos-form div.on{background:var(--pri);color:#fff}
.pasos-form div.hecho{background:var(--pri-c);color:var(--pri)}
.subida{display:grid;place-items:center;gap:4px;text-align:center;padding:24px;border:2px dashed var(--borde);border-radius:var(--r);background:#fbfaf7;cursor:pointer;color:var(--suave)}
.subida:hover{border-color:var(--pri)}
.subida.lista{border-style:solid;border-color:var(--ok);background:var(--ok-c);color:var(--ok)}
.evid{display:flex;gap:10px;flex-wrap:wrap}
.evid .arte{width:110px;aspect-ratio:1/1;border-radius:10px}

/* Auth */
.auth{max-width:440px;margin:32px auto}
.auth .tarjeta{padding:28px}
.perfiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.perfil-op{border:1px solid var(--borde);border-radius:10px;padding:14px;cursor:pointer;display:block;margin:0;font-weight:400}
.perfil-op:has(input:checked){border-color:var(--pri);background:var(--pri-c)}
.perfil-op input{display:none}
.perfil-op b{display:block}

/* Modal y avisos */
.capa{position:fixed;inset:0;background:rgba(31,27,46,.5);display:grid;place-items:center;z-index:40;padding:16px}
.modal{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;max-height:90vh;overflow:auto}
.modal-cab{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cerrar{border:0;background:transparent;font-size:1.4rem;cursor:pointer;color:var(--suave)}
.estrellas-sel{display:flex;gap:6px;font-size:2rem}
.estrellas-sel button{border:0;background:transparent;cursor:pointer;color:#d6d1c4;padding:0}
.estrellas-sel button.on{color:var(--acento)}
.toast{position:fixed;top:76px;left:50%;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:12px 18px;border-radius:10px;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.25);font-weight:500;max-width:90vw}
.comprobante{border:1px solid var(--borde);border-radius:10px;padding:18px;font-size:.9rem;background:#fffdf8}
.comprobante h3{font-family:Inter,sans-serif;font-size:.95rem;text-transform:uppercase;letter-spacing:.06em}

@media (max-width:860px){
  .heroe,.catalogo,.detalle,.dos-col{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .pegajoso{position:static}
  .filtros{display:flex;gap:6px;overflow:auto}
  .filtros h3,.filtros .solo-escritorio{display:none}
  .filtro-op{white-space:nowrap;width:auto;border:1px solid var(--borde);background:#fff}
}
@media (max-width:560px){
  .fila,.perfiles{grid-template-columns:1fr}
  .heroe{padding:22px}
  .top-der .texto{display:none}
  .rol span{display:none}
  .rol button{padding:8px 10px}
}
</style>
</head>
<body>
<header class="top"><div class="top-in" id="barra"></div></header>
<main class="contenedor" id="app"></main>
<div class="rol" role="group" aria-label="Ver el prototipo como">
  <span>Ver como</span>
  <button data-rol="cliente">Cliente</button>
  <button data-rol="emprendedor">Emprendedor</button>
  <button data-rol="admin">Administrador</button>
</div>
<div id="capa"></div>

<script>
/* =====================================================================
   Prototipo clicable de Tienda_EmprendeCol.
   Todo es simulado en memoria: recargar la página reinicia los datos.
   ===================================================================== */
const COMISION = 8;
const fmt = n => '$ ' + Math.round(n).toLocaleString('es-CO');

const ICONOS = {
  alimentos: '<path d="M14 20h28v14a12 12 0 0 1-12 12h-4a12 12 0 0 1-12-12z"/><path d="M42 24h4a6 6 0 0 1 0 12h-4"/><path d="M20 8c0 4 4 4 4 8M28 8c0 4 4 4 4 8"/>',
  artesanias: '<path d="M22 6h16v6l6 10v14a10 10 0 0 1-10 10h-8a10 10 0 0 1-10-10V22l6-10z"/><path d="M16 30h28"/>',

  hogar: '<path d="M8 28L30 10l22 18"/><path d="M14 24v24h32V24"/><path d="M26 48V34h8v14"/>',

const CATEGORIAS = [
  { id: 'alimentos', nombre: 'Alimentos y bebidas', color: '#7a4a2b' },
  { id: 'artesanias', nombre: 'Artesanías', color: '#b2593a' },
  { id: 'ropa', nombre: 'Ropa y accesorios', color: '#3d6b6b' },

  { id: 'hogar', nombre: 'Hogar y decoración', color: '#5a4b8a' },

const cat = id => CATEGORIAS.find(c => c.id === id);

const EMPRENDEDORES = [
  { id: 1, nombre: 'Café de la Montaña', ciudad: 'Medellín', color: '#7a4a2b', rating: 4.8, resenas: 36, verificado: true, desde: '2025',

  { id: 2, nombre: 'Manos de Barro', ciudad: 'El Carmen de Viboral', color: '#b2593a', rating: 4.6, resenas: 21, verificado: true, desde: '2025',

  { id: 3, nombre: 'Hilo Paisa', ciudad: 'Envigado', color: '#3d6b6b', rating: 4.2, resenas: 9, verificado: false, desde: '2026',
    desc: 'Prendas tejidas a mano en lana y algodón.' },
  { id: 4, nombre: 'Raíz Botánica', ciudad: 'Bello', color: '#6f7d3a', rating: 4.9, resenas: 14, verificado: true, desde: '2026',
    desc: 'Jabones y cosmética natural con plantas cultivadas en Antioquia.' },
];
const emp = id => EMPRENDEDORES.find(e => e.id === id);

const PRODUCTOS = [
  { id: 1, emp: 1, cat: 'alimentos', nombre: 'Café especial 500 g', base: 32000, stock: 40, tono: '#e9d8c4', desc: 'Tostión media con notas de panela y chocolate. Elige molido o en grano.' },
  { id: 2, emp: 1, cat: 'alimentos', nombre: 'Café especial 250 g', base: 18000, stock: 25, tono: '#efe1d0', desc: 'La presentación pequeña de nuestro café de origen.' },
  { id: 3, emp: 1, cat: 'hogar', nombre: 'Kit de filtrado V60', base: 95000, stock: 6, tono: '#e4e0f2', desc: 'Gotero, 40 filtros y jarra de vidrio para preparar café de filtro en casa.' },
  { id: 4, emp: 2, cat: 'artesanias', nombre: 'Taza de cerámica pintada', base: 28000, stock: 15, tono: '#f3ddd2', desc: 'Taza de 300 ml pintada a mano con motivos florales. Apta para lavavajillas.' },
  { id: 5, emp: 2, cat: 'hogar', nombre: 'Jarrón mediano', base: 64000, stock: 4, tono: '#efe0cf', desc: 'Jarrón de 25 cm esmaltado en tonos tierra.' },

  const d = o.despacho || {};

    ['Pago en custodia', `${o.fecha} · el emprendedor aún no recibe el dinero`],
    ['Despachado', d.fecha ? `${d.fecha} · ${d.transportadora}, guía ${d.guia}` : `Plazo para despachar: hasta el ${o.limite}`],
    ['Entregado', d.entrega ? `${d.entrega} según la transportadora` : 'Pendiente'],

  return `<ul class="tiempo">${pasos.map(([t, s], i) => {

function despachar(id, f) {

  ${lista.map(p => `<tr><td><div class="emp-mini"><div style="width:44px">${arte(p, 'sin-badge')}</div><b>${p.nombre}</b></div></td><td class="num">${fmt(p.base)}</td><td class="num"><b>${fmt(final(p.base))}</b></td><td class="num">${p.stock}</td><td><span class="badge b-ok">Activo</span></td>

function vEmpNuevo() {
  const n = S.nuevoProd, paso = n.paso;
  const est = i => i < paso ? 'hecho' : i === paso ? 'on' : '';
  const base = +(n.base || 0);
  let cuerpo = '';
  if (paso === 1) cuerpo = `<label for="nn">Nombre del producto</label><input id="nn" value="${n.nombre || ''}" placeholder="Ej.: Café especial 500 g">
    <label for="nc">Categoría</label><select id="nc">${CATEGORIAS.map(c => `<option value="${c.id}" ${n.cat === c.id ? 'selected' : ''}>${c.nombre}</option>`).join('')}</select>

  if (paso === 2) cuerpo = `<div class="fila"><div><label for="nb">Precio base (lo que recibes)</label><input id="nb" inputmode="numeric" value="${n.base || ''}" oninput="S.nuevoProd.base=this.value.replace(/\\D/g,'');document.getElementById('nf').textContent='${'$'} '+Math.round((+S.nuevoProd.base||0)*1.08).toLocaleString('es-CO')"></div>

    <div class="tarjeta" style="margin-top:14px;background:#fbfaf7;box-shadow:none"><div class="linea"><span>El cliente verá</span><b id="nf">${fmt(final(base))}</b></div><span class="peq muted">Incluye la comisión de la plataforma (${COMISION} %). Tú recibes el precio base.</span></div>`;
  if (paso === 3) cuerpo = `<label>Fotos del producto</label><div class="subida" onclick="this.classList.add('lista');this.innerHTML='<b>3 fotos listas</b><span class=peq>Toca para cambiar</span>'"><b>Toca para elegir fotos</b><span class="peq">JPG, PNG o WebP · hasta 5 fotos de 5 MB</span></div>`;
  return `<div style="max-width:680px"><p class="sobre"><a href="#/emp/productos">← Mis productos</a></p><h1>Publicar producto</h1>
  <div class="pasos-form" style="margin-top:16px"><div class="${est(1)}">1. Qué vendes</div><div class="${est(2)}">2. Precio y stock</div><div class="${est(3)}">3. Fotos</div></div>
  <div class="tarjeta">${cuerpo}
    <div style="display:flex;justify-content:space-between;margin-top:18px">
      ${paso > 1 ? `<button class="btn" onclick="pasoNuevo(-1)">← Atrás</button>` : '<span></span>'}
      ${paso < 3 ? `<button class="btn btn-p" onclick="pasoNuevo(1)">Siguiente →</button>` : `<button class="btn btn-p" onclick="publicar()">Publicar producto</button>`}
    </div></div></div>`;
}
function pasoNuevo(d) {
  const n = S.nuevoProd, g = id => document.getElementById(id);
  if (n.paso === 1) { n.nombre = g('nn').value; n.cat = g('nc').value; n.desc = g('nd').value; if (d > 0 && n.nombre.trim().length < 3) return toast('Escribe un nombre de al menos 3 caracteres.'); }
  if (n.paso === 2) { n.stock = g('ns').value; if (d > 0 && !(+n.base > 0)) return toast('Escribe un precio mayor que cero.'); }
  n.paso += d; render();
}
function publicar() {
  const n = S.nuevoProd;
  PRODUCTOS.push({ id: PRODUCTOS.length + 1, emp: 1, cat: n.cat || 'alimentos', nombre: n.nombre, base: +n.base, stock: +n.stock || 1, tono: '#ece5f6', desc: n.desc || '' });
  S.nuevoProd = { paso: 1 }; toast('¡Publicado! Ya aparece en el catálogo.'); ir('#/emp/productos');
}

const ESTADO_REP = { abierto: ['Abierto', 'b-mal'], en_revision: ['En revisión', 'b-acento'], resuelto: ['Resuelto', 'b-ok'] };
function vAdmin() {

function vAdminReportes() {

  ${S.reportes.map(r => `<tr><td><b>R-${r.id}</b><br><span class="peq muted">${r.fecha}</span></td><td>#${r.pedido}</td><td>${r.cliente}</td><td>${emp(r.emp).nombre}</td><td>${r.motivo}</td>

function vAdminReporte(id) {
  const r = S.reportes.find(x => x.id === +id); if (!r) return vNoExiste();

  return `<div class="cabecera"><div><p class="sobre"><a href="#/admin/reportes">← Reportes</a></p><h1>Reporte R-${r.id}</h1></div>${badge(ESTADO_REP[r.estado])}</div>
  <div class="dos-col">
    <div style="display:grid;gap:16px">

        <div class="evid">${Array.from({ length: Math.max(1, r.evidencias) }, () => `<div class="arte" style="background:#efe7da">${svgIco('foto', '#9a8a70')}</div>`).join('')}</div></div>

        <div class="linea peq"><span>Despacho registrado</span><b>${r.guia}</b></div></div>

        <label class="opcion-pago"><input type="radio" name="res" value="sancion"><div><b>Reembolsar y sancionar al emprendedor</b><br><span class="peq muted">Advertencia, suspensión o bloqueo.</span></div></label>
        <label for="sanc">Tipo de sanción (si aplica)</label><select id="sanc"><option value="advertencia">Advertencia</option><option value="suspension">Suspensión por 30 días</option><option value="bloqueo">Bloqueo definitivo</option></select>

      <hr class="sep"><div class="emp-mini">${logo(e, 40)}<div><b>${e.nombre}</b><br><span class="peq muted">${e.rating} ★ · ${e.resenas} reseñas</span></div></div>

function resolver(id, f) {
  const r = S.reportes.find(x => x.id === id);

  toast('Resolución guardada y notificada a ambas partes.'); render();
}

function guardarConfig(f) {

function vNoExiste() { return `<div class="vacio"><h2>Esta página no existe</h2><a class="btn btn-p" href="#/">Volver al inicio</a></div>`; }

/* ---------- enrutador ---------- */
const RUTAS = [
  [/^#?\/?$/, vCatalogo, 'cliente'], [/^#\/producto\/(\d+)$/, vProducto], [/^#\/emprendedor\/(\d+)$/, vEmprendedor],
  [/^#\/carrito$/, vCarrito, 'cliente'], [/^#\/checkout$/, vCheckout, 'cliente'], [/^#\/confirmado$/, vConfirmado, 'cliente'],
  [/^#\/pedidos$/, vPedidos, 'cliente'], [/^#\/pedido\/(\d+)$/, vPedido, 'cliente'], [/^#\/reportar\/(\d+)$/, vReportar, 'cliente'],
  [/^#\/login$/, vLogin], [/^#\/registro$/, vRegistro], [/^#\/recuperar$/, vRecuperar],
  [/^#\/emp$/, vEmpPanel, 'emprendedor'], [/^#\/emp\/pedidos$/, vEmpPedidos, 'emprendedor'], [/^#\/emp\/despacho\/(\d+)$/, vEmpDespacho, 'emprendedor'],
  [/^#\/emp\/productos$/, vEmpProductos, 'emprendedor'], [/^#\/emp\/nuevo$/, vEmpNuevo, 'emprendedor'],
  [/^#\/admin$/, vAdmin, 'admin'], [/^#\/admin\/reportes$/, vAdminReportes, 'admin'], [/^#\/admin\/reporte\/(\d+)$/, vAdminReporte, 'admin'],
  [/^#\/admin\/usuarios$/, vAdminUsuarios, 'admin'], [/^#\/admin\/config$/, vAdminConfig, 'admin'],
];
function render() {
  const h = location.hash || '#/';
  for (const [re, fn, rol] of RUTAS) {
    const m = h.match(re);
    if (m) {
      if (rol && S.rol !== rol && S.sesion) S.rol = rol;   // al entrar a una pantalla de otro rol, se cambia de rol
      barra();
      const y = window.scrollY;
      document.getElementById('app').innerHTML = fn(...m.slice(1));
      if (render.ultima === h) window.scrollTo(0, y); else window.scrollTo(0, 0);
      render.ultima = h;
      return;
    }
  }
  barra(); document.getElementById('app').innerHTML = vNoExiste();
}
function cambiarRol(r) {
  S.rol = r; S.sesion = true;
  ir(r === 'cliente' ? '#/' : r === 'emprendedor' ? '#/emp' : '#/admin');
  render();
}
document.querySelectorAll('.rol button').forEach(b => b.addEventListener('click', () => cambiarRol(b.dataset.rol)));
window.addEventListener('hashchange', () => { cerrarModal(); render(); });
render();
</script>
